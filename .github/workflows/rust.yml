name: Rust

on: [ push, pull_request ]

jobs:
  rust:
    runs-on: ubuntu-latest
    # Docker Hardened Images Rust toolchain, the family the Dockerfile builds
    # from. dhi.io signs in with the Docker Hub org credentials.
    container:
      image: dhi.io/rust:1-dev
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    strategy:
      matrix:
        toolchain:
          - "1.88"  # MSRV, set by tonic 0.14. Installed with rustup.
          - stable  # The hardened image's own toolchain, rustfmt and clippy.
          - beta    # Installed with rustup.
    steps:
      # The hardened image ships the Rust toolchain and a C linker only. The
      # actions need git and node, and rustup-managed toolchains need curl.
      - name: Install job tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git nodejs
          # The workspace mount belongs to the runner user, not root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        if: ${{ matrix.toolchain != 'stable' }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Toolchain version
        run: |
          cargo -vV
          rustc -vV
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
      - name: Format checks
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo fmt -- --check
      - name: Clippy checks
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo clippy --all-targets --all-features -- -Dwarnings

  proto:
    runs-on: ubuntu-latest
    # Docker Hardened Images Rust toolchain, the family the Dockerfile builds
    # from. dhi.io signs in with the Docker Hub org credentials.
    container:
      image: dhi.io/rust:1-dev
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      # The hardened image ships the Rust toolchain and a C linker only. The
      # actions need git and node, and rustup-managed toolchains need curl.
      - name: Install job tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git nodejs
          # The workspace mount belongs to the runner user, not root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A checksummed release download behaves the same on GitHub and Forgejo.
      - name: Install buf
        env:
          BUF_VERSION: 1.71.0
        run: |
          base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"
          bin="buf-Linux-$(uname -m)"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$bin"
          curl -sSfL "$base/sha256.txt" | grep " $bin\$" | sha256sum -c -
          install -m 0755 "$bin" /usr/local/bin/buf
          buf --version
      - name: Lint the protobuf contract
        run: |
          buf lint
          buf build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Both Dockerfile stages are Docker Hardened Images on dhi.io.
      - name: Log in to dhi.io
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | docker login dhi.io -u "$DOCKER_USER" --password-stdin
      # The image build runs the test suite itself, so this is both the
      # packaging check and a second, containerised run of the gate.
      - name: Build the container image
        run: docker build -t grpc-epub:ci .
