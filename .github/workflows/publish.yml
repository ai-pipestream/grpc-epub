name: Publish Images

# Builds the service and viewer images and pushes them to
# docker.io/pipestreamai. Every push to main republishes :latest.
# A push of a v<version> tag (the fleet release, cut on main) publishes
# :<version> beside :latest; so does a manual dispatch with a version
# input. Docker Hub credentials come from the DOCKER_USER / DOCKER_TOKEN
# org secrets.
#
# Multi-arch (amd64 + arm64): the runtime base (dhi.io/debian-base) and the
# viewer base (dhi.io/node) are both published for the two platforms, and
# the Rust build runs under QEMU for the arm64 leg.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra version tag (for example 0.1.0); optional'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="${INPUT_VERSION:-}" ;;
          esac
          if [ -n "$version" ] && ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]{0,63})?$ ]]; then
            echo "::error::version '$version' is not a semantic version such as 0.3.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          svc="docker.io/pipestreamai/grpc-epub:latest"
          ui="docker.io/pipestreamai/grpc-epub-ui:latest"
          if [ -n "$VERSION" ]; then
            svc="$svc,docker.io/pipestreamai/grpc-epub:$VERSION"
            ui="$ui,docker.io/pipestreamai/grpc-epub-ui:$VERSION"
          fi
          echo "svc=$svc" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
      - name: Build and push the service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.svc }}
      - name: Build and push the viewer image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: demos/node-client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.ui }}
